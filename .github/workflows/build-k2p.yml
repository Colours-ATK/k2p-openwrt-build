name: Build OpenWrt K2P (v25.12.6)

on:
  push:
    branches: [main]
    paths:
      - '.config'
      - '.github/workflows/build-k2p.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    steps:
      - name: Checkout config repo
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang flex bison g++ g++-multilib \
            gettext git libncurses-dev libssl-dev python3-setuptools python3-pyelftools \
            rsync swig unzip zlib1g-dev file wget

      - name: Clone OpenWrt source (tag v25.12.6)
        run: git clone --depth 1 --branch v25.12.6 https://github.com/openwrt/openwrt.git openwrt

      - name: Update and install feeds
        working-directory: openwrt
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Apply .config
        working-directory: openwrt
        run: |
          cp "$GITHUB_WORKSPACE/.config" .config
          make defconfig

      - name: Download packages
        working-directory: openwrt
        run: make download -j$(nproc)

      - name: Build firmware
        working-directory: openwrt
        run: |
          make -j$(nproc) || make -j1 V=s

      - name: Collect firmware images
        if: always()
        run: |
          mkdir -p firmware
          find openwrt/bin/targets -type f \( -name '*sysupgrade*' -o -name '*initramfs*' \) -exec cp {} firmware/ \;
          ls -la firmware/

      - name: Upload firmware artifact
        uses: actions/upload-artifact@v4
        with:
          name: openwrt-k2p-v25.12.6
          path: firmware/
          if-no-files-found: error
